<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kavadarci Vineyard - Spray Map</title>
<style>
:root{--bg:#0b1015;--panel:#121b23;--line:#25333f;--ink:#dfe9ef;--dim:#8497a5;
--amber:#f7a63b;--teal:#45d6b4;--mono:ui-monospace,"SF Mono",Menlo,monospace;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font-family:var(--sans);min-height:100vh;padding:28px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
.sub{font-family:var(--mono);color:var(--dim);font-size:13px;letter-spacing:.04em;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:720px){.grid{grid-template-columns:2fr 1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:#0a0f14}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1c2833;
font-family:var(--mono);font-size:14px}
.stat:last-child{border:none}.stat .k{color:var(--dim)}.stat .v{color:var(--ink)}
.stat .v.a{color:var(--amber)}.stat .v.t{color:var(--teal)}
.legend{display:flex;gap:18px;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--dim);flex-wrap:wrap}
.legend i{display:inline-block;width:22px;height:3px;vertical-align:middle;margin-right:6px}
.foot{font-family:var(--mono);font-size:11px;color:#5b6b78;margin-top:16px}
</style></head><body><div class="wrap">
<h1>Kavadarci Vineyard - Spray Coverage Map</h1>
<div class="sub">Tikvesh . 41.4402 N, 21.9002 E . boustrophedon coverage . 5 m rows</div>
<div class="grid">
 <div class="card"><canvas id="c" width="1200" height="1000"></canvas>
  <div class="legend">
   <span><i style="background:#45d6b4"></i>field boundary</span>
   <span><i style="background:#f7a63b"></i>spray pass (pump ON)</span>
   <span><i style="background:#5b6b78"></i>turnaround</span>
   <span style="color:#f7a63b">start</span><span style="color:#45d6b4">end - RTL</span>
  </div>
 </div>
 <div class="card" id="stats"></div>
</div>
<div class="foot">mission/kavadarci_spray.waypoints . QGC WPL 110 . load in Mission Planner / QGC or wp load</div>
</div>
<script>
const P={"wps": [[41.44067102733704, 21.89971869337642], [41.439670535464465, 21.90039942019952], [41.43968160179379, 21.900459150002614], [41.44067508661073, 21.899783190725202], [41.44067914588443, 21.899847688073983], [41.4396926681231, 21.900518879805713], [41.439703734452415, 21.900578609608807], [41.44068320515813, 21.899912185422764], [41.44068726443183, 21.899976682771545], [41.43971480078173, 21.900638339411906], [41.439725867111044, 21.900698069215], [41.44069132370553, 21.900041180120326], [41.44069538297923, 21.900105677469107], [41.43973693344036, 21.9007577990181]], "corners": [[41.439657, 21.900375], [41.439735, 21.900796], [41.440704, 21.90011], [41.440677, 21.899681]], "home": [41.44019325, 21.9002405], "rows": 7, "length": 888.3978191182467, "area": 4262.941904387852, "alt": 15.0, "speed": 6.0};
const c=document.getElementById('c'),x=c.getContext('2d');
const all=[...P.corners,...P.wps];
const lats=all.map(p=>p[0]),lons=all.map(p=>p[1]);
const la0=Math.min(...lats),la1=Math.max(...lats),lo0=Math.min(...lons),lo1=Math.max(...lons);
const pad=70,W=c.width,H=c.height;
function X(lon){return pad+(lon-lo0)/(lo1-lo0)*(W-2*pad);}
function Y(lat){return H-pad-(lat-la0)/(la1-la0)*(H-2*pad);}
x.fillStyle="#0f1a15";x.strokeStyle="#45d6b4";x.lineWidth=2.5;x.beginPath();
P.corners.forEach((p,i)=>{const px=X(p[1]),py=Y(p[0]);i?x.lineTo(px,py):x.moveTo(px,py);});
x.closePath();x.fill();x.stroke();
const w=P.wps;
for(let i=0;i<w.length-1;i++){
  const rowSeg=(i%2===0);
  x.strokeStyle=rowSeg?"#f7a63b":"#5b6b78";
  x.lineWidth=rowSeg?3:1.5; if(!rowSeg)x.setLineDash([5,5]);
  x.beginPath();x.moveTo(X(w[i][1]),Y(w[i][0]));x.lineTo(X(w[i+1][1]),Y(w[i+1][0]));x.stroke();
  x.setLineDash([]);
}
x.fillStyle="#f7a63b";x.beginPath();x.arc(X(w[0][1]),Y(w[0][0]),7,0,7);x.fill();
x.fillStyle="#45d6b4";x.beginPath();x.arc(X(w[w.length-1][1]),Y(w[w.length-1][0]),7,0,7);x.fill();
x.fillStyle="#dfe9ef";x.font="16px ui-monospace,monospace";x.textAlign="center";
for(let r=0;r<P.rows;r++){const a=w[r*2],b=w[r*2+1];
  x.fillText(String(r+1),(X(a[1])+X(b[1]))/2,(Y(a[0])+Y(b[0]))/2-6);}
const S=document.getElementById("stats");
const rows=[["Field area",(P.area/10000).toFixed(2)+" ha","t"],
["Spray rows",P.rows+" x 5 m","a"],
["Path length",Math.round(P.length)+" m",""],
["Flight time","~"+(P.length/P.speed/60).toFixed(1)+" min",""],
["Speed",P.speed+" m/s",""],["Altitude",P.alt+" m AGL",""],
["Waypoints",P.wps.length,""],["Home",P.home[0].toFixed(5)+", "+P.home[1].toFixed(5),""]];
S.innerHTML=rows.map(r=>"<div class=\"stat\"><span class=\"k\">"+r[0]+"</span><span class=\"v "+r[2]+"\">"+r[1]+"</span></div>").join("");
</script></body></html>
