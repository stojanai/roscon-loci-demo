version: 1

entries:
  - text: "AC_Sprayer::update worst case path must not exceed 6400 ns"
    kind: budget
    function: "AC_Sprayer::update"
    signal: worst_path_time
    bound: { max: 6400, unit: ns }
    severity: fail

  - text: "AC_Sprayer::update must use no more than 512 bytes of stack"
    kind: budget
    function: "AC_Sprayer::update"
    signal: stack_depth
    bound: { max: 512, unit: B }
    severity: fail

  - text: "ModeGuided::set_velaccel must run in under 10 microseconds"
    kind: budget
    function: "ModeGuided::set_velaccel"
    signal: worst_path_time
    bound: { max: 10000, unit: ns }
    severity: fail

  - text: "VisionIR::update must run in under 200 microseconds"
    kind: budget
    function: "VisionIR::update"
    signal: worst_path_time
    bound: { max: 200000, unit: ns }
    severity: fail

  - text: "VisionIR::update should use no more than 512 bytes of stack"
    kind: budget
    function: "VisionIR::update"
    signal: stack_depth
    bound: { max: 512, unit: B }
    severity: caution

  - text: "VisionIR::update hot path time should not regress more than 10 %"
    kind: regression
    function: "VisionIR::update"
    signal: hot_path_time
    bound: { max_delta: "+10 %" }
    severity: caution

  - text: "set the contract for AC_Sprayer::update hot path to 6000 ns"
    kind: budget
    function: "AC_Sprayer::update"
    signal: hot_path_time
    bound: { max: 6000, unit: ns }

  - text: "Copter::rc_loop scheduler budget is 130 us (250 Hz)"
    kind: budget
    function: "Copter::rc_loop"
    signal: worst_path_time
    bound: { max: 130000, unit: ns }

  - text: "AP_GPS::update scheduler budget is 200 us (50 Hz)"
    kind: budget
    function: "AP_GPS::update"
    signal: worst_path_time
    bound: { max: 200000, unit: ns }

  - text: "Copter::run_nav_updates scheduler budget is 100 us (50 Hz)"
    kind: budget
    function: "Copter::run_nav_updates"
    signal: worst_path_time
    bound: { max: 100000, unit: ns }

  - text: "GCS::update_receive scheduler budget is 180 us (400 Hz)"
    kind: budget
    function: "GCS::update_receive"
    signal: worst_path_time
    bound: { max: 180000, unit: ns }
